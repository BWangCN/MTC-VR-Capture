<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mocap markers in the obstacle course</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #15171a; --panel: rgba(24,26,30,.92); --fg: #e8e8e8; --dim: #9aa0a6; --accent: #ffb347; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 10px; align-items: center; padding: 8px 12px;
         background: var(--panel); border-bottom: 1px solid #2c2f34; z-index: 2; flex-wrap: wrap; }
  #top select, #top button { background: #2a2d33; color: var(--fg); border: 1px solid #3a3e45; border-radius: 4px; padding: 3px 8px; font: inherit; }
  #slider { flex: 1; min-width: 200px; }
  #flabel { font-variant-numeric: tabular-nums; min-width: 190px; color: var(--dim); }
  #side { position: fixed; right: 0; top: 46px; bottom: 0; width: 290px; overflow-y: auto; background: var(--panel);
          border-left: 1px solid #2c2f34; padding: 10px 12px; z-index: 2; box-sizing: border-box; }
  #side h3 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  #side label { display: block; margin: 3px 0; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; font-variant-numeric: tabular-nums; }
  .kv div:nth-child(odd) { color: var(--dim); }
  #views button { margin: 2px 2px 2px 0; background: #2a2d33; color: var(--fg); border: 1px solid #3a3e45; border-radius: 4px; padding: 3px 8px; }
  #hud { position: fixed; left: 12px; bottom: 10px; z-index: 2; background: var(--panel); padding: 6px 10px; border-radius: 6px;
         font-variant-numeric: tabular-nums; color: var(--fg); }
  .note { color: var(--dim); font-size: 12px; }
  body.capture #top, body.capture #side { display: none; }
  body.capture #hud { font-size: 15px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <select id="take"></select>
  <button id="play">Play</button>
  <select id="speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
  <input id="slider" type="range" min="0" max="1" value="0" step="1">
  <span id="flabel"></span>
</div>
<div id="side">
  <div id="views"><button data-v="top">Top</button><button data-v="side">Side</button><button data-v="follow">Follow</button><button data-v="free">Free</button></div>
  <h3>Show</h3>
  <label><input type="checkbox" id="t_room" checked> Room scan</label>
  <label><input type="checkbox" id="t_obj" checked> Objects and gates</label>
  <label><input type="checkbox" id="t_coll"> Collision proxies (contact feedback)</label>
  <label><input type="checkbox" id="t_route" checked> Route, start, goal, mug spot</label>
  <label><input type="checkbox" id="t_unl" checked> <span class="sw" style="background:#ff8c1a"></span>Unlabeled markers</label>
  <label><input type="checkbox" id="t_crop" checked> <span class="sw" style="background:#8a8a8a"></span>Markers the headset box dropped</label>
  <label><input type="checkbox" id="t_pico" checked> <span class="sw" style="background:#22d3ee"></span>Pico rigid body (4)</label>
  <label><input type="checkbox" id="t_v4w2" checked> <span class="sw" style="background:#e040fb"></span>Rigid body v4w2 (8)</label>
  <label><input type="checkbox" id="t_path" checked> <span class="sw" style="background:#22d3ee"></span>Headset path (Pico rigid body)</label>
  <label><input type="checkbox" id="t_cam" checked> <span class="sw" style="background:#ffe14d"></span>Unity camera, from Editor.log</label>
  <label><input type="checkbox" id="t_idcol"> Colour unlabeled by Motive trajectory id</label>
  <label><input type="checkbox" id="t_big"> Enlarge markers (x2.5)</label>
  <label>Cut room above <input type="range" id="cut" min="0.5" max="3.4" step="0.05" value="2.3"> <span id="cutv"></span></label>
  <h3>This take</h3>
  <div class="kv" id="info"></div>
  <h3>How it is placed</h3>
  <p class="note" id="method"></p>
</div>
<div id="hud"></div>

<script id="payload" type="application/json">/*PAYLOAD*/</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const P = JSON.parse(document.getElementById('payload').textContent);
const qs = new URLSearchParams(location.search);
if (qs.get('capture')) document.body.classList.add('capture');

function b64(s, Type) {
  const bin = atob(s); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Type(u8.buffer);
}
const MISSING = -32768;

// ---------------------------------------------------------------- renderer, scene, camera
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // colours are shown as stored (unlit, like the VR shader)
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);
const camera = new THREE.PerspectiveCamera(45, 1, 0.02, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = false;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize(); render(); });
resize();

// ---------------------------------------------------------------- environment
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 2.3);
const groups = { room: new THREE.Group(), obj: new THREE.Group(), coll: new THREE.Group(), route: new THREE.Group() };
Object.values(groups).forEach(g => scene.add(g));
for (const part of P.env.parts) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(b64(part.V, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(b64(part.F, Uint32Array), 1));
  let mat;
  if (part.kind === 'collision') {
    mat = new THREE.MeshBasicMaterial({ color: 0xe63c3c, wireframe: true, transparent: true, opacity: 0.35 });
  } else {
    g.setAttribute('color', new THREE.BufferAttribute(b64(part.C, Uint8Array), 3, true));
    mat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
    if (part.kind === 'room') mat.clippingPlanes = [cutPlane];
  }
  const m = new THREE.Mesh(g, mat);
  ({ room: groups.room, object: groups.obj, gate: groups.obj, collision: groups.coll, route: groups.route })[part.kind].add(m);
}
{ // planned route as a line just above the floor
  const r = P.env.route.flat().map((v, i) => (i % 3 === 1 ? v + 0.01 : v));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(r, 3));
  groups.route.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xffcc19 })));
}
groups.coll.visible = false;

// ---------------------------------------------------------------- markers
const BASE_R = P.marker_radius_display_m;
const sphere = new THREE.SphereGeometry(1, 14, 10);
function inst(max, color) {
  const m = new THREE.InstancedMesh(sphere, new THREE.MeshBasicMaterial({ color }), Math.max(1, max));
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.count = 0; m.frustumCulled = false; scene.add(m); return m;
}
const COL = { unl: new THREE.Color(0xff8c1a), crop: new THREE.Color(0x8a8a8a) };
let unlMesh, cropMesh, picoMesh, v4w2Mesh, headMesh, pathLine, camGroup;
const tmpM = new THREE.Matrix4(), tmpV = new THREE.Vector3(), tmpS = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), tmpC = new THREE.Color();

let T = null, cur = 0, playing = false, speed = 1, lastTs = null, view = 'top';
const takes = P.takes.map(t => ({ ...t, _dec: null }));
function decode(t) {
  if (t._dec) return t._dec;
  const n = b64(t.n, Uint16Array), off = new Uint32Array(n.length + 1);
  for (let i = 0; i < n.length; i++) off[i + 1] = off[i] + n[i];
  t._dec = { n, off, unl: b64(t.unl, Int16Array), flags: b64(t.flags, Uint8Array), ids: b64(t.ids, Uint32Array),
             pico: b64(t.pico, Int16Array), v4w2: b64(t.v4w2, Int16Array), head: b64(t.head, Int16Array),
             lowest: b64(t.lowest, Int16Array) };
  return t._dec;
}
function idColour(id, out) { const h = ((id * 2654435761) >>> 0) / 4294967296; return out.setHSL(h, 0.75, 0.55); }

function setTake(i) {
  T = takes[i]; const d = decode(T);
  [unlMesh, cropMesh, picoMesh, v4w2Mesh, headMesh].forEach(m => { if (m) { scene.remove(m); if (m.isInstancedMesh) m.dispose(); else m.geometry.dispose(); } });
  if (pathLine) scene.remove(pathLine); if (camGroup) scene.remove(camGroup);
  let mx = 0; for (let k = 0; k < d.n.length; k++) mx = Math.max(mx, d.n[k]);
  unlMesh = inst(mx, 0xffffff); cropMesh = inst(mx, 0x8a8a8a);
  unlMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(Math.max(1, mx) * 3), 3);
  picoMesh = inst(4, 0x22d3ee); v4w2Mesh = inst(8, 0xe040fb);
  headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.35 }));
  scene.add(headMesh);
  const pts = []; for (let k = 0; k < T.frames; k++) { const h = d.head; if (h[3 * k] !== MISSING) pts.push(h[3 * k] / 1000, h[3 * k + 1] / 1000, h[3 * k + 2] / 1000); }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  pathLine = new THREE.Line(pg, new THREE.LineBasicMaterial({ color: 0x22d3ee })); scene.add(pathLine);
  camGroup = new THREE.Group();
  for (const c of T.cams) {
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.03), new THREE.MeshBasicMaterial({ color: 0xffe14d, wireframe: true }));
    s.position.set(...c.p); camGroup.add(s);
  }
  scene.add(camGroup);
  const sl = document.getElementById('slider'); sl.max = T.frames - 1;
  document.getElementById('info').innerHTML = Object.entries(T.info).map(([k, v]) => `<div>${k}</div><div>${v}</div>`).join('');
  applyToggles(); setFrame(Math.min(cur, T.frames - 1)); setView(view);
}

function put(mesh, k, x, y, z, r) { tmpV.set(x, y, z); tmpS.setScalar(r); tmpM.compose(tmpV, tmpQ, tmpS); mesh.setMatrixAt(k, tmpM); }
function setFrame(i) {
  cur = Math.max(0, Math.min(T.frames - 1, i | 0)); const d = decode(T);
  const r = BASE_R * (document.getElementById('t_big').checked ? 2.5 : 1);
  const byId = document.getElementById('t_idcol').checked;
  let a = 0, b = 0;
  for (let k = d.off[cur]; k < d.off[cur + 1]; k++) {
    const x = d.unl[3 * k] / 1000, y = d.unl[3 * k + 1] / 1000, z = d.unl[3 * k + 2] / 1000;
    if (d.flags[k] & 1) { put(unlMesh, a, x, y, z, r); unlMesh.setColorAt(a, byId ? idColour(d.ids[k], tmpC) : COL.unl); a++; }
    else { put(cropMesh, b, x, y, z, r); b++; }
  }
  unlMesh.count = a; cropMesh.count = b;
  unlMesh.instanceMatrix.needsUpdate = true; cropMesh.instanceMatrix.needsUpdate = true;
  if (unlMesh.instanceColor) unlMesh.instanceColor.needsUpdate = true;
  for (const [mesh, arr, n] of [[picoMesh, d.pico, 4], [v4w2Mesh, d.v4w2, 8]]) {
    let c = 0;
    for (let j = 0; j < n; j++) { const o = 3 * (cur * n + j); if (arr[o] === MISSING) continue; put(mesh, c++, arr[o] / 1000, arr[o + 1] / 1000, arr[o + 2] / 1000, r); }
    mesh.count = c; mesh.instanceMatrix.needsUpdate = true;
  }
  const h = d.head;
  if (h[3 * cur] !== MISSING) headMesh.position.set(h[3 * cur] / 1000, h[3 * cur + 1] / 1000, h[3 * cur + 2] / 1000);
  document.getElementById('slider').value = cur;
  const tsec = cur / T.fps;
  document.getElementById('flabel').textContent = `frame ${cur} / ${T.frames - 1}   t = ${tsec.toFixed(2)} s`;
  const low = d.lowest[cur] === MISSING ? '–' : (d.lowest[cur] / 10).toFixed(1) + ' cm';
  document.getElementById('hud').textContent =
    `${T.label}   t ${tsec.toFixed(2)} s   markers ${a} kept${b ? ', ' + b + ' dropped' : ''}   lowest marker ${low} above floor`;
  if (view === 'follow') follow();
}

// ---------------------------------------------------------------- views
const bbox = new THREE.Box3().setFromArray(b64(P.env.parts.find(p => p.kind === 'room').V, Float32Array));
const roomC = bbox.getCenter(new THREE.Vector3());
function headPos() { const h = decode(T).head; return new THREE.Vector3(h[3 * cur] / 1000, h[3 * cur + 1] / 1000, h[3 * cur + 2] / 1000); }
function followOffset(hp) {
  // look at the person from the room centre side, from above the furniture (the room is cut above 2.3 m)
  const d = new THREE.Vector3(roomC.x - hp.x, 0, roomC.z - hp.z); if (d.length() < 0.3) d.set(1, 0, 1);
  d.normalize().multiplyScalar(2.1); return new THREE.Vector3(d.x, 2.15, d.z);
}
function follow() {
  const hp = headPos(); const tgt = new THREE.Vector3(hp.x, 0.55, hp.z);
  const jump = follow.last === undefined || Math.abs(cur - follow.last) > 12;
  if (!follow.off || jump) follow.off = followOffset(hp); else follow.off.lerp(followOffset(hp), 0.12);
  follow.last = cur;
  controls.target.copy(tgt); camera.position.copy(tgt).add(follow.off); controls.update();
}
function setView(v) {
  view = v;
  if (v === 'top') { camera.up.set(1, 0, 0); controls.target.copy(roomC).setY(0); camera.position.set(roomC.x, 9.5, roomC.z + 0.001); }
  else if (v === 'side') { camera.up.set(0, 1, 0); controls.target.copy(roomC).setY(0.8); camera.position.set(roomC.x - 6.5, 3.2, roomC.z + 2.0); }
  else if (v === 'follow') { camera.up.set(0, 1, 0); follow.off = null; follow.last = undefined; follow(); }
  else { camera.up.set(0, 1, 0); }
  controls.update(); render();
}
document.querySelectorAll('#views button').forEach(b => b.onclick = () => setView(b.dataset.v));

// ---------------------------------------------------------------- UI
function applyToggles() {
  const on = id => document.getElementById(id).checked;
  groups.room.visible = on('t_room'); groups.obj.visible = on('t_obj'); groups.coll.visible = on('t_coll'); groups.route.visible = on('t_route');
  if (unlMesh) { unlMesh.visible = on('t_unl'); cropMesh.visible = on('t_crop'); picoMesh.visible = on('t_pico'); v4w2Mesh.visible = on('t_v4w2');
                 pathLine.visible = on('t_path'); headMesh.visible = on('t_path'); camGroup.visible = on('t_cam'); }
  cutPlane.constant = +document.getElementById('cut').value; document.getElementById('cutv').textContent = (+document.getElementById('cut').value).toFixed(2) + ' m';
}
document.querySelectorAll('#side input').forEach(e => e.addEventListener('input', () => { applyToggles(); if (T) setFrame(cur); render(); }));
const sel = document.getElementById('take');
takes.forEach((t, i) => { const o = document.createElement('option'); o.value = i; o.textContent = t.label; sel.appendChild(o); });
sel.onchange = () => { cur = 0; setTake(+sel.value); render(); };
document.getElementById('slider').oninput = e => { setFrame(+e.target.value); render(); };
document.getElementById('speed').onchange = e => { speed = +e.target.value; };
const playBtn = document.getElementById('play');
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; lastTs = null; };
document.getElementById('method').textContent = P.method;

// split mode (?split=1, used for the videos): left = main camera, right = fixed top view of the whole room
const topCam = new THREE.PerspectiveCamera(32, 1, 0.5, 30);
const split = !!qs.get('split');
function placeTopCam(aspect) {
  topCam.aspect = aspect; topCam.up.set(1, 0, 0);
  topCam.position.set(roomC.x, 11.5, roomC.z + 0.001); topCam.lookAt(roomC.x, 0, roomC.z); topCam.updateProjectionMatrix();
}
function render() {
  if (!split) { renderer.render(scene, camera); return; }
  const w = window.innerWidth, h = window.innerHeight, wl = Math.round(w * 0.58);
  renderer.setScissorTest(true);
  camera.aspect = wl / h; camera.updateProjectionMatrix();
  renderer.setViewport(0, 0, wl, h); renderer.setScissor(0, 0, wl, h); renderer.render(scene, camera);
  placeTopCam((w - wl) / h);
  renderer.setViewport(wl, 0, w - wl, h); renderer.setScissor(wl, 0, w - wl, h); renderer.render(scene, topCam);
  renderer.setScissorTest(false);
}
controls.addEventListener('change', () => { if (view !== 'follow') view = 'free'; render(); });
let acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (playing && T) {
    if (lastTs !== null) { acc += (ts - lastTs) / 1000 * speed * T.fps; const s = Math.floor(acc); if (s > 0) { acc -= s; setFrame((cur + s) % T.frames); } }
    lastTs = ts; render();
  }
}

// ---------------------------------------------------------------- start, and an API for scripted screenshots
const t0 = +(qs.get('take') || 0), f0 = +(qs.get('frame') || 0);
cur = f0; view = qs.get('view') || 'top';
for (const k of (qs.get('hide') || '').split(',').filter(Boolean)) { const e = document.getElementById('t_' + k); if (e) e.checked = false; }
for (const k of (qs.get('show') || '').split(',').filter(Boolean)) { const e = document.getElementById('t_' + k); if (e) e.checked = true; }
if (qs.get('cut')) document.getElementById('cut').value = qs.get('cut');
sel.value = t0; setTake(t0);
if (qs.get('cam')) { const c = qs.get('cam').split(',').map(Number); camera.position.set(c[0], c[1], c[2]); controls.target.set(c[3], c[4], c[5]); camera.up.set(0, 1, 0); controls.update(); view = 'free'; }
render();
window.viewer = { setTake: i => { setTake(i); render(); }, setFrame: i => { setFrame(i); render(); }, setView: v => setView(v),
                  frames: () => T.frames, render, camera, controls, ready: true };
document.title = 'ready';
requestAnimationFrame(loop);
</script>
</body>
</html>
